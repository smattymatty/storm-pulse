# Storm Pulse Agent Configuration
#
# `stormpulse init` generates this file for you with paths that match the
# detected install mode, so you normally do not hand-write it. This example
# shows a rootless user-mode install (the production default) for an operator
# user named `deploy`. A legacy system install puts creds under /etc/stormpulse/
# and data under /opt/stormpulse/data/ instead.

[agent]
id = "vps-toronto-01"
pulse_token = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # from Server.pulse_token in dashboard
# disabled_commands = ["docker_logs"]  # optional, removes commands from the registry

[dashboard]
url = "wss://pulse.stormdevelopments.ca/ws/pulse/"
reconnect_min_seconds = 3
reconnect_max_seconds = 60
heartbeat_interval_seconds = 30

[tls]
ca_cert = "/home/deploy/.config/stormpulse/ca.pem"
client_cert = "/home/deploy/.config/stormpulse/agent.pem"
client_key = "/home/deploy/.config/stormpulse/agent-key.pem"

[auth]
hmac_secret = "/home/deploy/.config/stormpulse/hmac.key"  # path to the key file, not the secret (skylos: ignore[SKY-S101])
command_max_age_seconds = 60

[metrics]
push_interval_seconds = 15
collect_containers = true

[project]
project_dir = "/home/deploy/stormdevelopments"
compose_file = "/home/deploy/stormdevelopments/docker-compose.yml"
docker_service_name = "web"
# env_file = "/home/deploy/stormdevelopments/.env"  # optional, passed as --env-file to docker compose

[storage]
db_path = "/home/deploy/.local/share/stormpulse/stormpulse.db"

# ---------------------------------------------------------------------------
# Custom commands (optional)
# ---------------------------------------------------------------------------
# Built-in commands: git_pull, docker_logs
# Add your own commands below. Each [commands.<name>] defines a whitelisted
# subprocess call. Use placeholders like {project_dir}, {compose_file},
# {env_file}, and {docker_service_name} - they resolve from [project] config.
#
# Deploy commands - uncomment and adjust for your stack:
#
# [commands.docker_build]
# group = "deploy"
# command = ["/usr/bin/docker", "compose", "--env-file", "{env_file}", "-f", "{compose_file}", "build"]
# timeout = 300
# description = "Build Docker images"
#
# [commands.docker_down]
# group = "deploy"
# command = ["/usr/bin/docker", "compose", "--env-file", "{env_file}", "-f", "{compose_file}", "down"]
# timeout = 60
# requires_confirmation = true
# description = "Stop and remove containers"
#
# [commands.docker_up]
# group = "deploy"
# command = ["/usr/bin/docker", "compose", "--env-file", "{env_file}", "-f", "{compose_file}", "up", "-d"]
# timeout = 120
# description = "Start containers in detached mode"
#
# [commands.django_migrate]
# group = "deploy"
# command = ["/usr/bin/docker", "compose", "--env-file", "{env_file}", "-f", "{compose_file}", "exec", "{docker_service_name}", "python", "manage.py", "migrate"]
# timeout = 120
# description = "Run Django database migrations"
#
# Other examples:
#
# [commands.restart_caddy]
# group = "maintenance"
# command = ["/usr/bin/systemctl", "restart", "caddy.service"]
# timeout = 30
# requires_confirmation = true
# description = "Restart Caddy reverse proxy"
#
# Commands can declare overridable parameters with regex validation.
# The dashboard sends runtime overrides in the params dict; the agent
# validates them before substituting into the command template.
#
# A param carrying a credential must set `secret = true`: its value still
# reaches the command but is redacted from the agent's event and log records.
# Credential-shaped names (secret/password/token/passphrase) are refused at
# load without it.
#
# [commands.service_logs]
# group = "diagnostics"
# command = ["/usr/bin/docker", "compose", "-f", "{compose_file}", "logs", "--tail", "{lines}", "{service}"]
# timeout = 30
# description = "Show recent logs for a specific service"
#
# [commands.service_logs.params.service]
# placeholder = "service"
# default = "web"
# pattern = "[a-zA-Z0-9_-]+"
# description = "Docker Compose service name"
#
# [commands.service_logs.params.lines]
# placeholder = "lines"
# default = "100"
# pattern = "[0-9]{1,5}"
# description = "Number of log lines to show"

# ---------------------------------------------------------------------------
# Caddy (optional) - present on regional VPS agents that serve customer
# custom-domain HTTPS via Caddy. Enables the
# buckets_custom_domain_caddy_sync command. If main_caddyfile does not have
# an `import` directive resolving to drop_in_path (exact path or glob both
# count), the Caddy integration soft-disables with a named reason; the agent
# and every other integration keep running.
# ---------------------------------------------------------------------------
#
# [caddy]
# enabled = true
# admin_url = "http://localhost:2019"
# main_caddyfile = "/etc/caddy/Caddyfile"
# drop_in_path = "/etc/caddy/conf.d/buckets-custom-domains.caddy"

# ---------------------------------------------------------------------------
# Deploy investigation (optional) - what `stormpulse investigate deploy` may
# look for on THIS node. ADR CORE-009.
#
# Every parameter the probe uses resolves from here and from nowhere else: the
# dashboard cannot inject a path, a glob, or a unit name. A node with no
# section here reports INCONCLUSIVE naming the section it lacks, never CLEARED,
# because silence about a subject is not evidence that the subject is absent.
#
# One table per subject. The subject name is also the string matched against
# process arguments and artifact filenames.
#
# `expected_root` is where the unit installs the thing; `search_roots` are the
# bounded places the probe may look and must contain expected_root. A binary
# found in a search root but OUTSIDE expected_root is the finding, not an
# error: that is the 2026-09-07 alpha shape, where every install site in the
# repo named /home/storm/guard and the disk held /home/storm/buckets-guard.
#
# The walk never leaves these roots, never follows a symlink, and never
# descends past max_depth (1-8, default 3). It reports a file's existence,
# size and mtime and never opens it. The cost of that bound is real: residue
# in a root you do not name here is not found, and the case file says so and
# prints the one-off `find` that would settle it.
# ---------------------------------------------------------------------------
#
# [investigate.deploy.storm-buckets-guard]
# units = ["storm-buckets-guard.service"]   # checked in BOTH managers
# expected_root = "/home/storm/guard"
# search_roots = ["/home/storm", "/opt/storm"]
# ports = [6188]
# max_depth = 3
# max_bytes = 65536
