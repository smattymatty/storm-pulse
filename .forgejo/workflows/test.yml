name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job runs a Makefile target, so CI and `make check` share one definition.
# VENV= points make at the tools on PATH. Fitness Function 12 holds both.
jobs:
  # Quality gate (Skylos) on changed lines only: new code meets the bar, legacy
  # findings stay a baseline to burn down. Full clone because --diff needs the base.
  quality:
    runs-on: docker
    container:
      image: git.stormdevelopments.ca/official-private/storm-ci-python:3.12-2
      volumes:
        - pip-cache:/pip-cache

    steps:
      - name: Checkout code (full, with main)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --branch "$BRANCH" "https://any:${GITHUB_TOKEN}@git.stormdevelopments.ca/${GITHUB_REPOSITORY}.git" .
          git fetch origin main

      # PRs gate against their merge-base, pushes against the before-SHA. No usable
      # before-SHA (first or force push) falls back to the last commit, loudly.
      - name: Resolve the diff base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE=$(git merge-base origin/main HEAD)
          elif [ -n "$(printf '%s' "${EVENT_BEFORE:-}" | tr -d 0)" ] && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            BASE="$EVENT_BEFORE"
          else
            echo "no usable before-SHA: gating the last commit only"
            BASE=HEAD~1
          fi
          echo "BASE=${BASE}" >> "$GITHUB_ENV"

      - name: Comment and docstring lengths
        run: make VENV= BASE="$BASE" comments-diff

      # The pin lives in pyproject.toml's dev extra; static analysis needs nothing else.
      - name: Install skylos
        run: pip install --cache-dir /pip-cache "$(grep -o 'skylos==[0-9.]*' pyproject.toml)"

      - name: Quality scan, changed lines (skylos)
        run: make VENV= BASE="$BASE" quality

  # Security + secrets + AI-defect + dependency gate (Skylos), its own signal. The
  # project is installed so the dependency scan reads the tree a host would get.
  security:
    runs-on: docker
    container:
      image: git.stormdevelopments.ca/official-private/storm-ci-python:3.12-2
      volumes:
        - pip-cache:/pip-cache

    steps:
      - name: Checkout code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://any:${GITHUB_TOKEN}@git.stormdevelopments.ca/${GITHUB_REPOSITORY}.git" .

      - name: Install the project and its dev extra
        run: pip install --cache-dir /pip-cache -e ".[dev]"

      - name: Security scan (skylos)
        run: make VENV= security

  test:
    runs-on: docker
    container:
      image: git.stormdevelopments.ca/official-private/storm-ci-python:3.12-2
      volumes:
        - pip-cache:/pip-cache

    steps:
      - name: Checkout code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://any:${GITHUB_TOKEN}@git.stormdevelopments.ca/${GITHUB_REPOSITORY}.git" .

      - name: Install dependencies
        run: pip install --cache-dir /pip-cache -e ".[dev]"

      - name: Run tests
        run: make VENV= test

      - name: Type check
        run: make VENV= mypy

  # CORE-001 fitness suite, its own signal: red means an architectural or
  # security invariant was crossed, not a behavioural test failure.
  fitness:
    runs-on: docker
    container:
      image: git.stormdevelopments.ca/official-private/storm-ci-python:3.12-2
      volumes:
        - pip-cache:/pip-cache

    steps:
      - name: Checkout code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://any:${GITHUB_TOKEN}@git.stormdevelopments.ca/${GITHUB_REPOSITORY}.git" .

      - name: Install dependencies
        run: pip install --cache-dir /pip-cache -e ".[dev]"

      - name: Layer topology and custom fitness checks
        run: make VENV= fitness

  # Dead-code gate (Skylos), its own signal: red means unused code in the tree.
  deadcode:
    runs-on: docker
    container:
      image: git.stormdevelopments.ca/official-private/storm-ci-python:3.12-2
      volumes:
        - pip-cache:/pip-cache

    steps:
      - name: Checkout code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" "https://any:${GITHUB_TOKEN}@git.stormdevelopments.ca/${GITHUB_REPOSITORY}.git" .

      - name: Install skylos
        run: pip install --cache-dir /pip-cache "$(grep -o 'skylos==[0-9.]*' pyproject.toml)"

      - name: Dead-code scan (skylos)
        run: make VENV= deadcode
